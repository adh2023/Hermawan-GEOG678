<!DOCTYPE html>
<html>
  <head>
    <title>Lab 5: Tutorial 2 - Aurelius Hermawan</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>

    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <style>
		html, body {
			height: 100%;
			margin: 0;
		}
		.leaflet-container {
			height: 100%;
		}
	
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
	    const map = L.map('map').setView([51.505, -0.09], 13);

	    const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 19,
		attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
	    }).addTo(map);

        var LeafIcon = L.Icon.extend({
	        options: {
		        shadowUrl: 'https://leafletjs.com/examples/custom-icons/leaf-shadow.png',
		        iconSize:     [38, 95],
		        shadowSize:   [50, 64],
		        iconAnchor:   [22, 94],
		        shadowAnchor: [4, 62],
		        popupAnchor:  [-3, -76]
	            }
        });

        var greenIcon = new LeafIcon({iconUrl: 'https://leafletjs.com/examples/custom-icons/leaf-green.png'}),
	        redIcon = new LeafIcon({iconUrl: 'https://leafletjs.com/examples/custom-icons/leaf-red.png'}),
	        orangeIcon = new LeafIcon({iconUrl: 'https://leafletjs.com/examples/custom-icons/leaf-orange.png'});

        L.marker([51.5, -0.09], {icon: greenIcon}).addTo(map).bindPopup("I am a green leaf.");
        L.marker([51.495, -0.083], {icon: redIcon}).addTo(map).bindPopup("I am a red leaf.");
        L.marker([51.49, -0.1], {icon: orangeIcon}).addTo(map).bindPopup("I am an orange leaf.");

	    function onLocationFound(e) {
		const radius = e.accuracy / 2;

		const locationMarker = L.marker(e.latlng).addTo(map)
			.bindPopup(`You are within ${radius} meters from this point`).openPopup();

		const locationCircle = L.circle(e.latlng, radius).addTo(map);
	    }

	    function onLocationError(e) {
		    alert(e.message);
	    }

	    map.on('locationfound', onLocationFound);
	    map.on('locationerror', onLocationError);

	    map.locate({setView: true, maxZoom: 16});

    </script>
  </body>
</html>
